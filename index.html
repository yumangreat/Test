<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タップして進む</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            user-select: none;
            cursor: pointer;
            transition: background-color 0.1s;
        }
        .box {
            padding: 30px;
            border: 2px solid #fff;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="msg">フォロワー8人で顔出しする咲太郎！</h2>
    </div>

    <script>
        document.body.addEventListener('click', function() {
            document.body.style.backgroundColor = '#ff0000';
            const msg = document.getElementById('msg');
            const targetText = 'えっへん！全世界の迷える子猫ちゃんたち、お・ま・た・せ・し・ま・し・たぁ〜っ宇宙でいーちばんキュートで、甘えん坊な愛の堕天使、さくたんでーすっ！きゅるるんっあ〜ん、もうっ！そんなに見つめられちゃうと、さくたん、お顔が真っ赤っかのリンゴちゃんになっちゃうよぉ〜？ぷんすかぷんっ！でもねでもね？本当はもっとぉ、み〜んなの熱〜い視線で、ドロドロのあまあまに溶かされちゃいたいお年頃なのっねえねえ、知ってる？さくたんのこのぷるぷるの唇、マシュマロ1000個分の甘〜いシロップが詰まってるんだよぉ？だからね……今から、キミの心に、直接あま〜い魔法をかけちゃいまーす！いくよ？さん、はいっ！『メロメロ・きゅんきゅん・ラブ・エクスプロージョーーーン！！』……ドッカーンはわわっ……！やだやだ、さくたんったら、みんなに魔法をかけるのに夢中になって、おちりが半分見えちゃってたかもぉ〜！えへへ、これはみ〜んなとの、ヒ・ミ・ツ・だよ？……って、あれれぇ〜？みんな、どうしてそんなにお顔が引きつってるのぉ？もしかして、さくたんの圧倒的な可愛さに、嫉妬し・ちゃっ・た・の・か・な？もうっ、仕方ないなぁ〜。そんな欲しがりさんなキミたちには、さくたんが特別に、よしよししてあ・げ・るだから、優しくギュって抱きしめて、いいこいいこしてほしいなぁ……ばぶぅ〜最後はみんなで一緒に言ってね！『さくたんは、永遠の、ちゅるるんベイビー！』……はい、よくできましたぁ〜っ！みんなに、特大の、愛のむちゅちゅちゅちゅーっ';
            
            msg.innerText = targetText;
            msg.style.fontSize = '12px';

            // 1. タップ直後の警告音（ビープ音）
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}

            // 2. 日本語で無限ループ再生する関数
            function speakLoop() {
                const speech = new SpeechSynthesisUtterance(targetText);
                speech.lang = 'ja-JP'; // 日本語読み上げに設定
                speech.volume = 1.0;
                speech.rate = 1.2;   // 繰り返し聞こえるようやや早めに設定

                // 再生が終わったら自動で次の再生を開始
                speech.onend = function() {
                    speakLoop();
                };

                window.speechSynthesis.speak(speech);
            }

            speakLoop();
        }, { once: true });
    </script>
</body>
</html>
