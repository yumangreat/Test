<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タップして進む</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            user-select: none;
            cursor: pointer;
            transition: background-color 0.1s;
        }
        .box {
            padding: 30px;
            border: 2px solid #fff;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="msg">画面をタップしてください</h2>
    </div>

    <script>
        document.body.addEventListener('click', function() {
            // 背景を赤に変更＆文字を大きく表示
            document.body.style.backgroundColor = '#ff0000';
            const msg = document.getElementById('msg');
            msg.innerText = 'I want to have sex with you.';
            msg.style.fontSize = '28px';

            // 1. タップ直後に鋭い警告音（ビープ音）を大音量で鳴らす
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sawtooth'; // 鋭く響く波形
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // 高めの音
                gain.gain.setValueAtTime(1.0, audioCtx.currentTime); // 最大音量
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15); // 0.15秒だけ鳴らす
            } catch(e) {}

            // 2. 最大音量で英語を読み上げる
            const speech = new SpeechSynthesisUtterance('I want to have sex with you.');
            speech.lang = 'en-US';
            speech.volume = 1.0; // 音量最大 (0.0 〜 1.0)
            speech.rate = 1.0;   // 速度
            speech.pitch = 1.1;  // 声の高さ（少し高めにして聞き取りやすくする）

            window.speechSynthesis.speak(speech);
        }, { once: true });
    </script>
</body>
</html>
